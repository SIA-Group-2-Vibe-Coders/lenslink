<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LensLink - Photography Portfolio Management</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        zinc: { 850: '#202022', 900: '#18181b', 950: '#0f0f11' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col">
    
    <nav class="border-b border-zinc-800/50 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-bold text-xl">L</div>
                <span class="text-xl font-semibold tracking-tight text-white">LensLink</span>
            </div>
            <div class="space-x-4">
                <a href="login.html" class="text-sm font-medium text-zinc-400 hover:text-white transition">Sign In</a>
                <a href="register.html" class="text-sm font-medium bg-amber-500 text-zinc-950 px-4 py-2 rounded-full hover:bg-amber-400 transition">Get Started</a>
            </div>
        </div>
    </nav>

    <main class="flex-grow flex flex-col items-center justify-center text-center px-6 py-20 relative overflow-hidden">
        <div class="absolute inset-0 bg-[url('https://images.unsplash.com/photo-1452587925148-ce544e77e70d?q=80&w=2000&auto=format&fit=crop')] bg-cover bg-center opacity-10"></div>
        <div class="absolute inset-0 bg-gradient-to-t from-zinc-950 via-zinc-950/80 to-transparent"></div>
        
        <div class="relative z-10 max-w-3xl">
            <span class="px-3 py-1 text-xs font-semibold tracking-widest text-amber-500 uppercase border border-amber-500/30 rounded-full bg-amber-500/10 mb-6 inline-block">For Creators & Clients</span>
            <h1 class="text-5xl md:text-7xl font-bold text-white mb-6 tracking-tight">Elevate Your Visual <span class="text-transparent bg-clip-text bg-gradient-to-r from-amber-400 to-amber-600">Legacy</span></h1>
            <p class="text-lg md:text-xl text-zinc-400 mb-10 max-w-2xl mx-auto">A premium platform to host, manage, and securely deliver high-resolution photography to your clients with elegant galleries.</p>
            
            <div class="flex flex-col sm:flex-row items-center justify-center gap-4">
                <a href="register.html" class="w-full sm:w-auto px-8 py-3 rounded-full bg-amber-500 text-zinc-950 font-semibold hover:bg-amber-400 transition shadow-[0_0_20px_rgba(245,158,11,0.3)]">Create Portfolio</a>
                <a href="login.html" class="w-full sm:w-auto px-8 py-3 rounded-full bg-zinc-800 text-white font-medium hover:bg-zinc-700 transition border border-zinc-700">Client Access</a>
            </div>
        </div>
    </main>

    <footer class="py-8 border-t border-zinc-800 text-center text-sm text-zinc-500">
        &copy; 2026 LensLink Photography Platform. All rights reserved.
    </footer>

    <script src="assets/js/main.js"></script>
</body>
</html>
