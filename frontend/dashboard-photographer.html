<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photographer Dashboard - LensLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col">
    
    <nav class="border-b border-zinc-800/50 glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-bold text-xl">L</div>
                <span class="text-xl font-semibold tracking-tight text-white">Photographer Panel</span>
            </div>
            <div class="flex items-center space-x-6">
                <a href="profile-edit.html" id="userNameDisplay" class="text-sm font-medium text-amber-500 hover:text-amber-400 transition" title="Edit Profile"></a>
                <a href="feed.html" class="text-sm font-medium text-zinc-400 hover:text-white transition">Social Feed</a>
                <a href="photographers.html" class="text-sm font-medium text-zinc-400 hover:text-white transition">Discover</a>
                <button onclick="logout()" class="text-sm font-medium text-zinc-400 hover:text-white transition">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-8">
        <div class="flex justify-between items-center mb-8">
            <h1 class="text-3xl font-bold text-white">My Galleries</h1>
            <button class="bg-amber-500 text-zinc-950 px-4 py-2 rounded-lg font-medium hover:bg-amber-400 transition">
                + New Gallery
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mb-12" id="galleryGrid">
            <!-- Dynamic Galleries will go here. Showing a placeholder -->
            <div class="glass-panel rounded-xl overflow-hidden border border-zinc-800/50 hover:border-amber-500/50 transition cursor-pointer group">
                <div class="h-48 bg-zinc-900 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-tr from-zinc-800 to-zinc-900 group-hover:scale-105 transition duration-500"></div>
                </div>
                <div class="p-4">
                    <h3 class="text-lg font-bold text-white mb-1">Summer Wedding</h3>
                    <p class="text-xs text-zinc-500 mb-3">Created 2 days ago &bull; 45 items</p>
                    <div class="flex justify-between items-center">
                        <span class="text-xs bg-zinc-800 px-2 py-1 rounded text-zinc-300">Private</span>
                        <button class="text-amber-500 text-sm hover:text-amber-400 font-medium">Manage &rarr;</button>
                    </div>
                </div>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-white mb-6">Upload Images</h2>
        <div class="glass-panel p-8 rounded-xl border border-zinc-800/50 text-center border-dashed border-2 border-zinc-700 hover:border-amber-500/50 transition">
            <form id="uploadForm" enctype="multipart/form-data">
                <div class="mb-4 text-zinc-400">
                    <svg class="w-12 h-12 mx-auto mb-3 text-zinc-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"></path></svg>
                    <p class="text-lg font-medium text-white">Drag and drop images here</p>
                    <p class="text-sm">or click to select files (JPG, PNG, WEBP)</p>
                </div>
                <input type="file" id="imageInput" name="image" accept="image/*" class="hidden">
                <input type="hidden" id="album_id" name="album_id" value="1">
                <button type="button" onclick="document.getElementById('imageInput').click()" class="bg-zinc-800 text-white px-6 py-2 rounded-lg font-medium hover:bg-zinc-700 transition">
                    Select File
                </button>
                <div id="uploadStatus" class="mt-4 text-sm font-medium"></div>
            </form>
        </div>
    </main>

    <script src="https://js.pusher.com/8.4/pusher.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/chat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth(2); // 2 = Photographer
            if (user) {
                document.getElementById('userNameDisplay').textContent = user.name;
                loadGalleries();

                // Initialize chat system
                initChat(user);
            }
        });

        async function loadGalleries() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-12 text-zinc-500">Loading galleries...</div>';
            
            try {
                const res = await apiCall('gallery');
                if (res.status === 'success' && res.data.length > 0) {
                    grid.innerHTML = '';
                    res.data.forEach(gallery => {
                        const card = document.createElement('div');
                        card.className = 'glass-panel rounded-xl overflow-hidden border border-zinc-800/50 hover:border-amber-500/50 transition group';
                        card.innerHTML = `
                            <div class="h-48 bg-zinc-900 relative overflow-hidden">
                                <img src="${getStorageUrl(gallery.cover_image)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${gallery.title}">
                                <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/80 to-transparent"></div>
                            </div>
                            <div class="p-4">
                                <h3 class="text-lg font-bold text-white mb-1">${gallery.title}</h3>
                                <p class="text-xs text-zinc-500 mb-3">${gallery.description || 'No description'}</p>
                                <div class="flex justify-between items-center pt-3 border-t border-zinc-800/50">
                                    <div class="flex items-center gap-2">
                                        <span class="text-[10px] bg-zinc-800 px-1.5 py-0.5 rounded text-zinc-400 font-medium uppercase">${gallery.is_public ? 'Public' : 'Private'}</span>
                                        <button onclick="openChat(${gallery.id})" class="text-amber-500 hover:text-amber-400 transition" title="Message Client">
                                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.77 9.77 0 01-4-.847L3 20l1.075-3.224A7.963 7.963 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                        </button>
                                    </div>
                                    <button onclick="manageGallery(${gallery.id})" class="text-white text-sm hover:text-amber-500 font-bold transition">Manage &rarr;</button>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-zinc-500">No galleries found. Create your first one!</div>';
                }
            } catch (err) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-red-500">Failed to load galleries.</div>';
            }
        }

        function manageGallery(id) {
            // Future: Redirect to gallery management page
            alert('Gallery management for ID ' + id + ' coming soon!');
        }

        // Upload Logic
        const imageInput = document.getElementById('imageInput');
        const uploadStatus = document.getElementById('uploadStatus');

        imageInput.addEventListener('change', async (e) => {
            if (e.target.files.length === 0) return;
            
            const file = e.target.files[0];
            const formData = new FormData();
            formData.append('image', file);
            formData.append('album_id', 1); // For demo, we use album ID 1
            
            uploadStatus.textContent = 'Uploading...';
            uploadStatus.className = 'mt-4 text-sm font-medium text-amber-500';

            try {
                const res = await apiCall('upload', 'POST', formData);
                
                if (res.status === 'success') {
                    uploadStatus.textContent = 'Upload successful!';
                    uploadStatus.className = 'mt-4 text-sm font-medium text-emerald-500';
                    // Refresh gallery view if needed
                    setTimeout(() => { uploadStatus.textContent = ''; }, 3000);
                } else {
                    uploadStatus.textContent = 'Error: ' + (res.message || 'Unknown error');
                    uploadStatus.className = 'mt-4 text-sm font-medium text-red-500';
                }
            } catch (err) {
                uploadStatus.textContent = 'Upload failed.';
                uploadStatus.className = 'mt-4 text-sm font-medium text-red-500';
            }
        });

    </script>
</body>
</html>
