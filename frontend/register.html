<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - LensLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col justify-center items-center px-4 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-amber-900/20 via-zinc-950 to-zinc-950 -z-10"></div>
    
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 mb-6">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-bold text-xl">L</div>
                <span class="text-2xl font-semibold tracking-tight text-white">LensLink</span>
            </a>
            <h2 class="text-3xl font-bold text-white mb-2">Create an account</h2>
            <p class="text-zinc-400 text-sm">Join the premium photography platform.</p>
        </div>

        <div class="glass-panel p-8 rounded-2xl border border-zinc-800/50 shadow-2xl relative">
            <div id="alertBox" class="hidden mb-4 p-3 rounded bg-red-500/10 border border-red-500/50 text-red-400 text-sm text-center"></div>
            <div id="successBox" class="hidden mb-4 p-3 rounded bg-emerald-500/10 border border-emerald-500/50 text-emerald-400 text-sm text-center"></div>
            
            <form id="registerForm" class="space-y-4">
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Full Name</label>
                    <input type="text" id="full_name" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Account Type</label>
                    <select id="role_id" class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition appearance-none">
                        <option value="3">Client</option>
                        <option value="2">Photographer</option>
                    </select>
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-amber-500 text-zinc-950 font-semibold rounded-lg px-4 py-3 hover:bg-amber-400 transition mt-4">
                    Create Account
                </button>
            </form>
            
            <div class="mt-6 text-center text-sm text-zinc-500">
                Already have an account? <a href="login.html" class="text-amber-500 hover:text-amber-400 font-medium">Sign in</a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const full_name = document.getElementById('full_name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const role_id = document.getElementById('role_id').value;
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            const successBox = document.getElementById('successBox');
            
            btn.innerHTML = 'Creating...';
            btn.disabled = true;
            alertBox.classList.add('hidden');
            successBox.classList.add('hidden');
            
            try {
                const res = await apiCall('register', 'POST', { full_name, email, password, role_id });
                
                if (res.status === 'success') {
                    successBox.textContent = 'Account created successfully! Redirecting to login...';
                    successBox.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                } else {
                    alertBox.textContent = res.message || 'Registration failed.';
                    alertBox.classList.remove('hidden');
                    btn.innerHTML = 'Create Account';
                    btn.disabled = false;
                }
            } catch (err) {
                alertBox.textContent = 'Connection error. Please try again.';
                alertBox.classList.remove('hidden');
                btn.innerHTML = 'Create Account';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
