<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - LensLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        zinc: { 850: '#202022', 900: '#18181b', 950: '#0f0f11' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col justify-center items-center px-4 relative overflow-hidden">
    <!-- Premium Ambient Lighting -->
    <div class="absolute top-[-20%] right-[-10%] w-[600px] h-[600px] rounded-full bg-amber-500/10 blur-[120px] -z-10"></div>
    <div class="absolute bottom-[-20%] left-[-10%] w-[600px] h-[600px] rounded-full bg-amber-600/5 blur-[120px] -z-10"></div>
    
    <!-- Decorative Grid Overlay -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#8080800a_1px,transparent_1px),linear-gradient(to_bottom,#8080800a_1px,transparent_1px)] bg-[size:32px_32px] -z-10"></div>

    <div class="w-full max-w-md animate-fade-in">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-3 mb-6 group">
                <div class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-bold text-xl shadow-[0_0_20px_rgba(245,158,11,0.4)] group-hover:scale-105 transition-transform duration-300">L</div>
                <span class="text-2xl font-bold tracking-tight text-white group-hover:text-amber-400 transition-colors">LensLink</span>
            </a>
            <h2 class="text-3xl font-extrabold text-white mb-2 tracking-tight">Welcome Back</h2>
            <p class="text-zinc-400 text-sm">Enter your credentials to enter the creator portal.</p>
        </div>

        <div class="glass-panel p-8 rounded-2xl border border-zinc-800/40 shadow-2xl relative">
            <div id="alertBox" class="hidden mb-4 p-3.5 rounded-xl bg-red-500/10 border border-red-500/30 text-red-400 text-sm text-center"></div>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-zinc-900/60 border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition duration-300">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-zinc-400 uppercase tracking-wider mb-1.5">Password</label>
                    <input type="password" id="password" required class="w-full bg-zinc-900/60 border border-zinc-800 rounded-xl px-4 py-3 text-white placeholder-zinc-600 focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition duration-300">
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold rounded-xl px-4 py-3.5 transition duration-300 mt-2 shadow-[0_0_20px_rgba(245,158,11,0.35)] hover:shadow-[0_0_25px_rgba(245,158,11,0.5)] transform hover:-translate-y-0.5">
                    Sign In
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-800/80"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-zinc-950/80 backdrop-blur-md px-3 text-zinc-500 font-semibold tracking-wider">Or continue with</span></div>
            </div>

            <button id="firebaseLogin" class="w-full bg-zinc-900/80 hover:bg-zinc-850 text-white font-medium rounded-xl px-4 py-3 border border-zinc-800/80 hover:border-zinc-700/80 transition duration-300 flex items-center justify-center space-x-2.5 shadow-md">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                <span class="text-sm font-semibold">Sign in with Google</span>
            </button>
            
            <div class="mt-6 text-center text-sm text-zinc-500">
                New to the platform? <a href="register.html" class="text-amber-400 hover:text-amber-300 font-semibold transition-colors">Create account</a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAZcQZK_9sWrz8L7XVU-qra_bNfY86dKXc",
            authDomain: "lenslink-43561.firebaseapp.com",
            projectId: "lenslink-43561",
            storageBucket: "lenslink-43561.firebasestorage.app",
            messagingSenderId: "859298338221",
            appId: "1:859298338221:web:8f6dcc69e7270bf4997d24",
            measurementId: "G-R4VZBVRQYT"
        };
        
        // Initialize Firebase
        if (firebaseConfig.apiKey !== "FIREBASE_API_KEY") {
            firebase.initializeApp(firebaseConfig);
        }

        const googleProvider = new firebase.auth.GoogleAuthProvider();

        async function handleFirebaseLogin() {
            if (firebaseConfig.apiKey === "FIREBASE_API_KEY") {
                alert("Please configure your Firebase credentials in login.html");
                return;
            }

            try {
                const result = await firebase.auth().signInWithPopup(googleProvider);
                const idToken = await result.user.getIdToken();
                
                // Sync with backend
                const syncRes = await apiCall('auth/firebase', 'POST', { id_token: idToken });
                
                if (syncRes.status === 'success' || syncRes.user) {
                    localStorage.setItem('auth_token', syncRes.token || 'firebase_session');
                    localStorage.setItem('user', JSON.stringify(syncRes.user));
                    
                    if (syncRes.user.role_id == 1) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                }
            } catch (error) {
                console.error("Firebase Login Error:", error);
                alert("Firebase Login Failed: " + error.message);
            }
        }

        document.getElementById('firebaseLogin').onclick = handleFirebaseLogin;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            btn.innerHTML = 'Signing in...';
            btn.disabled = true;
            
            try {
                const res = await apiCall('login', 'POST', { email, password });
                
                if (res.status === 'success') {
                    // Save Sanctum token and user data
                    localStorage.setItem('auth_token', res.token);
                    localStorage.setItem('user', JSON.stringify(res.data));
                    
                    // Redirect based on role
                    if (res.data.role_id == 1) {
                        window.location.href = 'admin.html';
                    } else {
                        window.location.href = 'dashboard.html';
                    }
                } else {
                    let errMsg = res.message || 'Login failed.';
                    if (res.errors) {
                        errMsg = Object.values(res.errors).flat().join('<br>');
                    }
                    alertBox.innerHTML = errMsg;
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.textContent = 'Connection error. Please try again.';
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
