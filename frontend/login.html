<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - LensLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col justify-center items-center px-4 relative overflow-hidden">
    <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_top_right,_var(--tw-gradient-stops))] from-amber-900/20 via-zinc-950 to-zinc-950 -z-10"></div>
    
    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <a href="index.html" class="inline-flex items-center space-x-2 mb-6">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-bold text-xl">L</div>
                <span class="text-2xl font-semibold tracking-tight text-white">LensLink</span>
            </a>
            <h2 class="text-3xl font-bold text-white mb-2">Welcome back</h2>
            <p class="text-zinc-400 text-sm">Enter your credentials to access your account.</p>
        </div>

        <div class="glass-panel p-8 rounded-2xl border border-zinc-800/50 shadow-2xl relative">
            <div id="alertBox" class="hidden mb-4 p-3 rounded bg-red-500/10 border border-red-500/50 text-red-400 text-sm text-center"></div>
            
            <form id="loginForm" class="space-y-5">
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Email Address</label>
                    <input type="email" id="email" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition">
                </div>
                <div>
                    <label class="block text-sm font-medium text-zinc-400 mb-1">Password</label>
                    <input type="password" id="password" required class="w-full bg-zinc-900 border border-zinc-800 rounded-lg px-4 py-2.5 text-white focus:outline-none focus:border-amber-500/50 focus:ring-1 focus:ring-amber-500/50 transition">
                </div>
                
                <button type="submit" id="submitBtn" class="w-full bg-amber-500 text-zinc-950 font-semibold rounded-lg px-4 py-3 hover:bg-amber-400 transition mt-2">
                    Sign In
                </button>
            </form>

            <div class="relative my-6">
                <div class="absolute inset-0 flex items-center"><div class="w-full border-t border-zinc-800"></div></div>
                <div class="relative flex justify-center text-xs uppercase"><span class="bg-zinc-950 px-2 text-zinc-500">Or continue with</span></div>
            </div>

            <button id="firebaseLogin" class="w-full bg-white text-zinc-950 font-semibold rounded-lg px-4 py-3 hover:bg-zinc-200 transition flex items-center justify-center space-x-2">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5 h-5">
                <span>Sign in with Google</span>
            </button>
            
            <div class="mt-6 text-center text-sm text-zinc-500">
                Don't have an account? <a href="register.html" class="text-amber-500 hover:text-amber-400 font-medium">Create one</a>
            </div>
        </div>
    </div>

    <script src="assets/js/main.js"></script>
    
    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>

    <script>
        // Firebase Configuration (Placeholders - to be filled by user in production)
        const firebaseConfig = {
            apiKey: "FIREBASE_API_KEY",
            authDomain: "lenslink-auth.firebaseapp.com",
            projectId: "lenslink-auth",
            storageBucket: "lenslink-auth.appspot.com",
            messagingSenderId: "SENDER_ID",
            appId: "APP_ID"
        };
        
        // Initialize Firebase
        if (firebaseConfig.apiKey !== "FIREBASE_API_KEY") {
            firebase.initializeApp(firebaseConfig);
        }

        const googleProvider = new firebase.auth.GoogleAuthProvider();

        async function handleFirebaseLogin() {
            if (firebaseConfig.apiKey === "FIREBASE_API_KEY") {
                alert("Please configure your Firebase credentials in login.html");
                return;
            }

            try {
                const result = await firebase.auth().signInWithPopup(googleProvider);
                const idToken = await result.user.getIdToken();
                
                // Sync with backend
                const syncRes = await apiCall('auth/firebase', 'POST', { id_token: idToken });
                
                if (syncRes.status === 'success' || syncRes.user) {
                    localStorage.setItem('auth_token', syncRes.token || 'firebase_session');
                    localStorage.setItem('user', JSON.stringify(syncRes.user));
                    window.location.href = syncRes.user.role_id == 2 ? 'dashboard-photographer.html' : 'dashboard-client.html';
                }
            } catch (error) {
                console.error("Firebase Login Error:", error);
                alert("Firebase Login Failed: " + error.message);
            }
        }

        document.getElementById('google-login-btn').onclick = handleFirebaseLogin;

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const btn = document.getElementById('submitBtn');
            const alertBox = document.getElementById('alertBox');
            
            btn.innerHTML = 'Signing in...';
            btn.disabled = true;
            
            try {
                const res = await apiCall('login', 'POST', { email, password });
                
                if (res.status === 'success') {
                    // Save Sanctum token and user data
                    localStorage.setItem('auth_token', res.token);
                    localStorage.setItem('user', JSON.stringify(res.data));
                    
                    // Redirect based on role
                    if (res.data.role_id == 1) window.location.href = 'admin.html';
                    else if (res.data.role_id == 2) window.location.href = 'dashboard-photographer.html';
                    else window.location.href = 'dashboard-client.html';
                } else {
                    let errMsg = res.message || 'Login failed.';
                    if (res.errors) {
                        errMsg = Object.values(res.errors).flat().join('<br>');
                    }
                    alertBox.innerHTML = errMsg;
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.textContent = 'Connection error. Please try again.';
                alertBox.classList.remove('hidden');
            } finally {
                btn.innerHTML = 'Sign In';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
