<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Client Portal - LensLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col">
    
    <nav class="border-b border-zinc-800/50 glass-nav sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-bold text-xl">L</div>
                <span class="text-xl font-semibold tracking-tight text-white">Client Portal</span>
            </div>
            <div class="flex items-center space-x-6">
                <a href="profile-edit.html" id="userNameDisplay" class="text-sm font-medium text-amber-500 hover:text-amber-400 transition" title="Edit Profile"></a>
                <a href="feed.html" class="text-sm font-medium text-zinc-400 hover:text-white transition">Social Feed</a>
                <a href="photographers.html" class="text-sm font-medium text-zinc-400 hover:text-white transition">Discover</a>
                <button onclick="logout()" class="text-sm font-medium text-zinc-400 hover:text-white transition">Sign Out</button>
            </div>
        </div>
    </nav>

    <main class="flex-grow max-w-7xl mx-auto w-full px-6 py-8">
        <h1 class="text-3xl font-bold text-white mb-2">My Collections</h1>
        <p class="text-zinc-400 mb-8">Access your personalized photography galleries and downloads securely.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 mb-12" id="galleryGrid">
            <!-- Mock Gallery Card -->
            <div class="glass-panel rounded-xl overflow-hidden border border-zinc-800/50 hover:border-amber-500/50 transition cursor-pointer group">
                <div class="h-64 bg-zinc-900 relative overflow-hidden">
                    <div class="absolute inset-0 bg-gradient-to-tr from-zinc-800 to-zinc-900 group-hover:scale-105 transition duration-500 flex items-center justify-center">
                        <span class="text-zinc-700 font-bold text-xl">Cover Image</span>
                    </div>
                </div>
                <div class="p-6">
                    <h3 class="text-xl font-bold text-white mb-2">Summer Wedding</h3>
                    <p class="text-sm text-zinc-400 mb-4">A beautiful collection of memories from your special day.</p>
                    <div class="flex justify-between items-center pt-4 border-t border-zinc-800/50">
                        <span class="text-xs text-zinc-500">Expires: Never</span>
                        <button class="text-zinc-950 bg-amber-500 px-4 py-1.5 rounded-full text-sm font-medium hover:bg-amber-400 transition">View Album</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="https://js.pusher.com/8.4/pusher.min.js"></script>
    <script src="assets/js/main.js"></script>
    <script src="assets/js/chat.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = await checkAuth(3); // 3 = Client
            if (user) {
                document.getElementById('userNameDisplay').textContent = 'Welcome, ' + user.name;
                loadGalleries();

                // Initialize chat system
                initChat(user);
            }
        });

        async function loadGalleries() {
            const grid = document.getElementById('galleryGrid');
            grid.innerHTML = '<div class="col-span-full text-center py-12 text-zinc-500">Loading collections...</div>';
            
            try {
                // For client portal, we show galleries where the client is assigned
                const res = await apiCall('gallery');
                if (res.status === 'success' && res.data.length > 0) {
                    grid.innerHTML = '';
                    res.data.forEach(gallery => {
                        const card = document.createElement('div');
                        card.className = 'glass-panel rounded-xl overflow-hidden border border-zinc-800/50 hover:border-amber-500/50 transition group';
                        card.innerHTML = `
                            <div class="h-64 bg-zinc-900 relative overflow-hidden">
                                <img src="${getStorageUrl(gallery.cover_image)}" class="w-full h-full object-cover group-hover:scale-105 transition duration-500" alt="${gallery.title}">
                                <div class="absolute inset-0 bg-gradient-to-t from-zinc-950/80 to-transparent"></div>
                            </div>
                            <div class="p-6">
                                <h3 class="text-xl font-bold text-white mb-2">${gallery.title}</h3>
                                <p class="text-sm text-zinc-400 mb-4">${gallery.description || 'No description available.'}</p>
                                <div class="flex flex-col gap-3 pt-4 border-t border-zinc-800/50">
                                    <div class="flex justify-between items-center">
                                        <span class="text-xs text-zinc-500 font-medium uppercase tracking-wider">Gallery Access</span>
                                        <button onclick="openChat(${gallery.id})" class="text-amber-500 hover:text-amber-400 text-sm font-semibold flex items-center gap-1.5 transition">
                                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.77 9.77 0 01-4-.847L3 20l1.075-3.224A7.963 7.963 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"></path></svg>
                                            Message
                                        </button>
                                    </div>
                                    <button onclick="viewGallery(${gallery.id})" class="w-full text-zinc-950 bg-amber-500 py-2.5 rounded-lg text-sm font-bold hover:bg-amber-400 transition shadow-lg shadow-amber-500/10">
                                        View Full Album
                                    </button>
                                </div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                } else {
                    grid.innerHTML = '<div class="col-span-full text-center py-12 text-zinc-500">No collections available for your account yet.</div>';
                }
            } catch (err) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-red-500">Failed to load collections.</div>';
            }
        }

        function viewGallery(id) {
            alert('Opening gallery ' + id + '...');
        }

    </script>
</body>
</html>
