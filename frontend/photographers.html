<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discover Photographers - LensLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://js.pusher.com/8.0/pusher.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script src="assets/js/chat.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        zinc: { 850: '#202022', 900: '#18181b', 950: '#0f0f11' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b' }
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col">
    
    <nav class="border-b border-zinc-800/50 bg-zinc-950/80 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <a href="index.html" class="flex items-center space-x-2">
                <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-bold text-xl">L</div>
                <span class="text-xl font-semibold tracking-tight text-white">LensLink</span>
            </a>
            <div id="nav-links" class="flex items-center space-x-6">
                <a href="feed.html" class="text-sm font-medium text-zinc-400 hover:text-white transition">Social Feed</a>
                <a href="photographers.html" class="text-sm font-medium text-amber-500">Discover</a>
            </div>
        </div>
    </nav>

    <header class="pt-20 pb-12 text-center px-6">
        <h1 class="text-4xl md:text-5xl font-bold text-white mb-4 tracking-tight">Discover Master <span class="text-amber-500">Creators</span></h1>
        <p class="text-zinc-400 max-w-2xl mx-auto">Browse through our curated community of professional photographers and find the perfect match for your next project.</p>
    </header>

    <section class="max-w-7xl mx-auto px-6 pb-20 w-full">
        <!-- Search & Filter -->
        <div class="mb-12 space-y-4">
            <div class="flex flex-col md:flex-row gap-4 items-center justify-between">
                <div class="relative w-full md:w-96">
                    <input type="text" id="search-input" placeholder="Search by name or specialty..." 
                        class="w-full bg-zinc-900 border border-zinc-800 rounded-full py-3 px-6 text-sm focus:outline-none focus:border-amber-500 transition">
                </div>
                <div class="flex gap-2 overflow-x-auto pb-2 w-full md:w-auto no-scrollbar">
                    <button class="filter-btn active px-4 py-2 rounded-full text-xs font-semibold bg-amber-500 text-zinc-950">All</button>
                    <button class="filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700">Wedding</button>
                    <button class="filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700">Portrait</button>
                    <button class="filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700">Landscape</button>
                    <button class="filter-btn px-4 py-2 rounded-full text-xs font-semibold bg-zinc-900 text-zinc-400 border border-zinc-800 hover:border-zinc-700">Event</button>
                </div>
            </div>
            
            <div class="flex flex-col md:flex-row gap-4 items-center p-4 bg-zinc-900/30 rounded-3xl border border-zinc-800/50">
                <div class="flex items-center gap-2 text-amber-500 px-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span class="text-xs font-bold uppercase tracking-wider">Location Search</span>
                </div>
                <div class="flex-grow relative">
                    <input type="text" id="location-input" placeholder="Enter city or address (e.g. Manila, Philippines)" 
                        class="w-full bg-zinc-950 border border-zinc-800 rounded-2xl py-2.5 px-4 text-xs focus:outline-none focus:border-amber-500 transition">
                </div>
                <button id="location-search-btn" class="px-6 py-2.5 rounded-2xl bg-zinc-800 text-white text-xs font-bold hover:bg-amber-500 hover:text-zinc-950 transition-all active:scale-95">
                    Find Nearby (Google Maps)
                </button>
            </div>
        </div>

        <!-- Photographer Grid -->
        <div id="photographer-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8">
            <!-- Shimmer Loading -->
            <div class="animate-pulse bg-zinc-900/50 rounded-3xl h-80 border border-zinc-800/50"></div>
            <div class="animate-pulse bg-zinc-900/50 rounded-3xl h-80 border border-zinc-800/50"></div>
            <div class="animate-pulse bg-zinc-900/50 rounded-3xl h-80 border border-zinc-800/50"></div>
        </div>
    </section>

    <footer class="mt-auto py-8 border-t border-zinc-800 text-center text-sm text-zinc-500">
        &copy; 2026 LensLink Photography Platform.
    </footer>

    <script src="assets/js/main.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const grid = document.getElementById('photographer-grid');
            
            // Init Chat if user logged in
            const user = JSON.parse(localStorage.getItem('user'));
            if (user && window.initChat) {
                window.initChat(user);
            }
            
            // Location Search
            const locationInput = document.getElementById('location-input');
            const locationBtn = document.getElementById('location-search-btn');

            locationBtn.onclick = async () => {
                const address = locationInput.value.trim();
                if (!address) return;

                locationBtn.innerHTML = '<span class="animate-pulse">Searching...</span>';
                locationBtn.disabled = true;

                try {
                    const result = await apiCall(`search/location?address=${encodeURIComponent(address)}`);
                    if (result.status === 'success' && result.coordinates) {
                        // Mock filtering based on coordinates
                        const photographersRes = await apiCall('photographers');
                        const nearby = photographersRes.data.map(p => ({
                            ...p,
                            distance: (Math.random() * 15 + 1).toFixed(1) // Mock distance for visual effect
                        })).sort((a, b) => a.distance - b.distance);
                        
                        renderPhotographers(nearby, address);
                    }
                } catch (e) {
                    alert("Location search requires a valid Google Maps API Key in the backend.");
                } finally {
                    locationBtn.innerHTML = 'Find Nearby (Google Maps)';
                    locationBtn.disabled = false;
                }
            };
            
            try {
                const result = await apiCall('photographers');
                
                if (result.status === 'success') {
                    renderPhotographers(result.data);
                } else {
                    grid.innerHTML = '<p class="col-span-full text-center text-zinc-500">Failed to load photographers.</p>';
                }
            } catch (error) {
                grid.innerHTML = '<p class="col-span-full text-center text-zinc-500">API Connection Error. Please ensure the backend is running.</p>';
            }

            function renderPhotographers(photographers, searchLocation = null) {
                grid.innerHTML = '';
                if (photographers.length === 0) {
                    grid.innerHTML = '<p class="col-span-full text-center text-zinc-500">No photographers found yet.</p>';
                    return;
                }

                photographers.forEach(p => {
                    const avatar = p.avatar || `https://ui-avatars.com/api/?name=${encodeURIComponent(p.name)}&background=f59e0b&color=18181b&size=128`;
                    const card = `
                        <div class="group relative bg-zinc-900/40 border border-zinc-800/50 rounded-[2rem] p-8 hover:bg-zinc-900/60 transition-all duration-500 hover:border-amber-500/30 hover:-translate-y-2 overflow-hidden">
                            <!-- Background Accent -->
                            <div class="absolute top-0 right-0 w-32 h-32 bg-amber-500/5 blur-3xl -mr-16 -mt-16 group-hover:bg-amber-500/10 transition-colors"></div>
                            
                            <div class="flex items-start justify-between mb-8">
                                <div class="relative">
                                    <img src="${avatar}" alt="${p.name}" class="w-20 h-20 rounded-3xl object-cover border-2 border-zinc-800 group-hover:border-amber-500/50 transition duration-500">
                                    <div class="absolute -bottom-2 -right-2 w-6 h-6 bg-zinc-950 rounded-full border-4 border-zinc-900 flex items-center justify-center">
                                        <div class="w-2 h-2 bg-emerald-500 rounded-full animate-pulse"></div>
                                    </div>
                                </div>
                                <button onclick="event.preventDefault(); window.openDirectChat(${p.id}, '${p.name.replace(/'/g, "\\'")}')" 
                                    class="p-3 rounded-2xl bg-zinc-800/50 border border-zinc-700/50 text-zinc-400 hover:text-amber-500 hover:border-amber-500/30 transition-all active:scale-95">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M21 12c0 4.418-4.03 8-9 8a9.77 9.77 0 01-4-.847L3 20l1.075-3.224A7.963 7.963 0 013 12c0-4.418 4.03-8 9-8s9 3.582 9 8z"/></svg>
                                </button>
                            </div>

                            <div class="mb-6">
                                <h3 class="text-xl font-bold text-white mb-1 group-hover:text-amber-400 transition-colors">${p.name}</h3>
                                <p class="text-[10px] text-amber-500 font-bold uppercase tracking-[0.2em] opacity-80">${p.specialty || 'Creator'}</p>
                            </div>

                            <p class="text-sm text-zinc-400 line-clamp-2 mb-8 leading-relaxed font-light">
                                ${p.bio || 'Capturing the essence of life through a professional lens.'}
                            </p>

                            <div class="flex items-center justify-between pt-6 border-t border-white/5">
                                <div class="flex flex-col">
                                    <span class="text-[9px] text-zinc-600 uppercase tracking-widest font-bold mb-0.5">Location</span>
                                    <span class="text-zinc-300 text-xs font-semibold">${p.location || 'Remote'}</span>
                                    ${p.distance ? `<span class="text-[10px] text-amber-500 font-bold mt-1">~${p.distance} km away</span>` : ''}
                                </div>
                                <a href="photographer-profile.html?id=${p.id}" class="text-xs font-black text-white uppercase tracking-widest hover:text-amber-500 transition-colors flex items-center gap-2 group/btn">
                                    Profile 
                                    <svg class="w-4 h-4 transform group-hover/btn:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/></svg>
                                </a>
                            </div>
                        </div>
                    `;
                    grid.innerHTML += card;
                });
            }
        });
    </script>
</body>
</html>
