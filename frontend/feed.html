<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Social Photofeed - LensLink</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Outfit', 'sans-serif'] },
                    colors: {
                        zinc: { 850: '#202022', 900: '#18181b', 950: '#0f0f11' },
                        amber: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' }
                    }
                }
            }
        }
    </script>
    <style>
        /* Heartbeat double-tap pop animation */
        @keyframes heartbeat {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 0; }
            15% { transform: translate(-50%, -50%) scale(1.2); opacity: 0.9; }
            30% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.9; }
            80% { transform: translate(-50%, -50%) scale(1); opacity: 0.9; }
            100% { transform: translate(-50%, -50%) scale(1.5); opacity: 0; }
        }
        .heartbeat-active {
            animation: heartbeat 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* Slide-over comments panel */
        .slide-over {
            transform: translateX(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .slide-over.active {
            transform: translateX(0);
        }
    </style>
</head>
<body class="bg-zinc-950 text-zinc-200 font-sans antialiased min-h-screen flex flex-col relative overflow-x-hidden">

    <!-- Premium Ambient Lighting -->
    <div class="absolute top-[-10%] right-[-10%] w-[600px] h-[600px] rounded-full bg-amber-500/5 blur-[120px] -z-10"></div>
    <div class="absolute top-[40%] left-[-15%] w-[600px] h-[600px] rounded-full bg-amber-600/5 blur-[120px] -z-10"></div>

    <!-- Decorative Grid Overlay -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#80808005_1px,transparent_1px),linear-gradient(to_bottom,#80808005_1px,transparent_1px)] bg-[size:40px_40px] -z-10"></div>

    <!-- Navigation Header -->
    <nav class="border-b border-zinc-900/60 bg-zinc-950/80 backdrop-blur-xl sticky top-0 z-40 transition-all duration-300">
        <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-3 group cursor-pointer" onclick="window.location.href='index.html'">
                <div class="w-9 h-9 rounded-full bg-gradient-to-tr from-amber-400 to-amber-600 flex items-center justify-center text-zinc-950 font-extrabold text-xl shadow-[0_0_15px_rgba(245,158,11,0.3)]">L</div>
                <span class="text-xl font-bold tracking-tight text-white group-hover:text-amber-400 transition-colors duration-300">LensLink</span>
            </div>
            
            <div class="flex items-center space-x-6">
                <!-- Navigation Portal Links -->
                <button onclick="goToPortal()" class="text-sm font-semibold text-zinc-400 hover:text-white bg-zinc-900/60 px-4 py-2 rounded-full border border-zinc-800 transition">
                    Dashboard
                </button>
                <span id="userNameDisplay" class="text-sm font-medium text-amber-500 hidden sm:inline-block"></span>
                <button onclick="logout()" class="text-sm font-medium text-zinc-400 hover:text-white transition">Sign Out</button>
            </div>
        </div>
    </nav>

    <!-- Main Container -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-4 sm:px-6 py-8 flex flex-col gap-8">
        
        <!-- Welcome Header -->
        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 border-b border-zinc-900/60 pb-6">
            <div>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-white tracking-tight">Unified Photofeed</h1>
                <p class="text-zinc-400 text-sm mt-1">Explore, share, and inspire in the exclusive visual gallery.</p>
            </div>
            
            <!-- Open Post Upload Modal Trigger -->
            <button onclick="toggleUploadModal(true)" class="flex items-center gap-2 px-5 py-3 rounded-full bg-gradient-to-r from-amber-400 to-amber-600 text-zinc-950 font-bold hover:shadow-[0_0_20px_rgba(245,158,11,0.4)] transition duration-300 transform active:scale-95 shadow-[0_4px_12px_rgba(245,158,11,0.2)]">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"></path></svg>
                Share a Moment
            </button>
        </div>

        <!-- Feed List Timeline -->
        <section class="flex flex-col gap-8" id="postsTimeline">
            <!-- Loading State -->
            <div class="glass-panel p-12 rounded-2xl border border-zinc-800/50 text-center text-zinc-500 animate-pulse">
                <div class="w-12 h-12 rounded-full border-4 border-t-amber-500 border-zinc-800 mx-auto animate-spin mb-4"></div>
                Initializing your creative feed...
            </div>
        </section>

    </main>

    <!-- Creator Post Box Modal -->
    <div id="uploadModal" class="fixed inset-0 z-50 flex items-center justify-center p-4 bg-zinc-950/80 backdrop-blur-md hidden opacity-0 transition-opacity duration-300">
        <div class="glass-panel w-full max-w-lg rounded-2xl border border-zinc-800/80 shadow-2xl p-6 sm:p-8 flex flex-col gap-6 transform scale-95 transition-transform duration-300">
            <div class="flex justify-between items-center">
                <h3 class="text-xl font-bold text-white">Share a Premium Moment</h3>
                <button onclick="toggleUploadModal(false)" class="text-zinc-400 hover:text-white p-1 rounded-full hover:bg-zinc-900 transition">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Upload Form -->
            <form id="postUploadForm" onsubmit="handlePostSubmit(event)" class="flex flex-col gap-5">
                <!-- Photo File Picker / Drag Drop -->
                <div class="flex flex-col gap-2">
                    <label class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Select Photograph</label>
                    <div id="dropzone" class="border-2 border-dashed border-zinc-800 hover:border-amber-500/50 rounded-xl p-6 flex flex-col items-center justify-center gap-3 cursor-pointer transition bg-zinc-900/40 relative overflow-hidden group">
                        <input type="file" id="postImageInput" accept="image/*" class="absolute inset-0 opacity-0 cursor-pointer z-10" onchange="previewSelectedImage(event)" required>
                        
                        <div id="uploaderPlaceholder" class="flex flex-col items-center justify-center text-center gap-2">
                            <div class="w-12 h-12 rounded-full bg-zinc-900 flex items-center justify-center text-zinc-400 group-hover:scale-105 group-hover:bg-zinc-850 transition duration-300">
                                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path></svg>
                            </div>
                            <span class="text-sm font-medium text-zinc-300">Click to upload or drag & drop</span>
                            <span class="text-xs text-zinc-500">Supports high-res PNG, JPG or WEBP (Max 10MB)</span>
                        </div>

                        <!-- Preview Container -->
                        <div id="imagePreviewContainer" class="hidden absolute inset-0 bg-zinc-950 flex items-center justify-center">
                            <img id="imagePreview" class="max-w-full max-h-full object-contain" src="" alt="Post Preview">
                            <button type="button" onclick="resetImagePreview(event)" class="absolute top-3 right-3 bg-zinc-950/80 hover:bg-zinc-900 text-white rounded-full p-2 border border-zinc-800 transition z-20">
                                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                            </button>
                        </div>
                    </div>
                </div>

                <!-- Caption text area -->
                <div class="flex flex-col gap-2">
                    <label for="postCaption" class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Write Caption</label>
                    <textarea id="postCaption" rows="3" placeholder="Tell a story behind this frame..." class="w-full bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500/50 text-white placeholder-zinc-500 resize-none transition" required></textarea>
                </div>

                <!-- Location tagging -->
                <div class="flex flex-col gap-2">
                    <label for="postLocation" class="text-xs font-semibold text-zinc-400 uppercase tracking-wider">Geotag Location</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 pl-3 flex items-center text-zinc-500 pointer-events-none">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
                        </span>
                        <input type="text" id="postLocation" placeholder="E.g., Amalfi Coast, Italy" class="w-full bg-zinc-900 border border-zinc-800 rounded-xl pl-9 pr-4 py-3 text-sm focus:outline-none focus:border-amber-500/50 text-white placeholder-zinc-500 transition">
                    </div>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitPostBtn" class="w-full py-3.5 rounded-xl bg-gradient-to-r from-amber-400 to-amber-600 text-zinc-950 font-bold hover:shadow-[0_0_20px_rgba(245,158,11,0.25)] transition duration-300 flex items-center justify-center gap-2 mt-2">
                    Publish Frame
                </button>
            </form>
        </div>
    </div>

    <!-- Frosted Side Slide-Over Drawer for Comments -->
    <div id="commentsDrawerBackdrop" class="fixed inset-0 z-40 bg-zinc-950/60 backdrop-blur-sm hidden opacity-0 transition-opacity duration-300" onclick="toggleCommentsDrawer(false)"></div>
    
    <div id="commentsDrawer" class="slide-over fixed inset-y-0 right-0 z-50 w-full max-w-md bg-zinc-950/95 border-l border-zinc-900 backdrop-blur-2xl flex flex-col h-full shadow-2xl">
        <!-- Header -->
        <div class="px-6 py-5 border-b border-zinc-900/60 flex justify-between items-center bg-zinc-950/80">
            <div>
                <h3 class="text-lg font-bold text-white">Comments</h3>
                <span id="drawerLikesCount" class="text-xs text-zinc-400">0 Likes</span>
            </div>
            <button onclick="toggleCommentsDrawer(false)" class="text-zinc-400 hover:text-white p-1 rounded-full hover:bg-zinc-900 transition">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
            </button>
        </div>

        <!-- Post Reference Card inside drawer -->
        <div class="p-4 border-b border-zinc-900 bg-zinc-950/30 flex gap-3.5">
            <img id="drawerPostImage" class="w-16 h-16 object-cover rounded-lg border border-zinc-800" src="" alt="Post image thumbnail">
            <div class="flex-grow min-w-0">
                <p id="drawerPostAuthor" class="text-xs font-bold text-amber-500"></p>
                <p id="drawerPostCaption" class="text-xs text-zinc-400 line-clamp-2 mt-0.5"></p>
            </div>
        </div>

        <!-- Scrollable list of comments -->
        <div class="flex-grow overflow-y-auto px-6 py-6 flex flex-col gap-5" id="drawerCommentsList">
            <!-- Dynamic comments get appended here -->
        </div>

        <!-- Interactive bottom Comment Input -->
        <div class="p-4 border-t border-zinc-900 bg-zinc-950">
            <form id="commentSubmitForm" onsubmit="handleCommentSubmit(event)" class="flex gap-2.5">
                <input type="text" id="commentInput" placeholder="Add a premium comment..." class="flex-grow bg-zinc-900 border border-zinc-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-amber-500/50 text-white placeholder-zinc-500 transition" required>
                <button type="submit" class="bg-amber-500 hover:bg-amber-400 text-zinc-950 font-bold px-5 py-3 rounded-xl text-sm transition transform active:scale-95 shadow-[0_4px_10px_rgba(245,158,11,0.15)] flex items-center justify-center">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 19l9-2 9 2V5l-9 2-9-2v14z"></path></svg>
                </button>
            </form>
        </div>
    </div>

    <!-- Toast Notification Banner -->
    <div id="toastNotification" class="fixed bottom-6 right-6 z-50 transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-3 px-5 py-3.5 rounded-xl border bg-zinc-900 text-sm font-semibold max-w-sm pointer-events-none shadow-2xl">
        <span id="toastIcon" class="text-amber-500 text-lg"></span>
        <span id="toastMsg" class="text-zinc-200"></span>
    </div>

    <!-- Scripts -->
    <script src="assets/js/main.js"></script>
    <script src="assets/js/feed.js"></script>
</body>
</html>
